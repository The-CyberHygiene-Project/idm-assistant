# --- CyberHygiene additions (core 0.2.0, spec 2026-10-12 §4.3): full content checks on the appliance's own security
# configuration, which the stock file checks only for permissions or not at all. sha512 only (FIPS-approved).
CHPCONTENT = p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha512
/etc/chp CHPCONTENT
/etc/kanidm CHPCONTENT
/etc/step-ca CHPCONTENT
/etc/ssh-ca CHPCONTENT
/etc/ssh/sshd_config.d CHPCONTENT
/etc/ssh/chp_user_ca.pub$ CHPCONTENT
/etc/authselect CHPCONTENT
/etc/nsswitch.conf$ CHPCONTENT
/etc/fapolicyd CHPCONTENT
/etc/selinux CHPCONTENT
/etc/idm-collect CHPCONTENT
/etc/systemd/system CHPCONTENT
/var/lib/ssh-ca/keys CHPCONTENT
# EXCLUDE /etc/pki/kanidm: Kanidm TLS certificate re-issued every 24 h (ACME); covered by 30-kanidm-cert + 31-renew-timer (row 24)
!/etc/pki/kanidm
# EXCLUDE /etc/step-ca/db: step-ca issuance database, rewritten at every daily renewal; covered by 30-kanidm-cert (chain to the pinned root)
# (data, like the Kanidm database; /etc/step-ca configuration and keys stay content-checked)
!/etc/step-ca/db
# EXCLUDE /var/log/aide: AIDE's own reports, written after the database snapshot; covered by 60-aide-result + 61-aide-stale
!/var/log/aide
# EXCLUDE /var/log/audit/audit\.log\.[0-9]+$: rotated audit logs, added at every auditd rotation (quiet check 2026-10-16); the live audit.log and the directory stay checked; covered by auditd's root-only 0600/0400 files (3.3.8)
!/var/log/audit/audit\.log\.[0-9]+$
# --- end of CyberHygiene additions. Exclusions are added below only from measurement (spec §4.4-4.5).
