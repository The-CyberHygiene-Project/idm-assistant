[Service]
# D7 (Plan 3): LoadCredential= was unreachable from inside this unit on systemd 252 (/run/credentials is mode 000 and
# /run/credentials/kanidmd.service was "Permission denied" for the dynamic user), although a minimal systemd-run test
# worked. Instead, a root pre-start step ("+") copies the TLS chain + key into the unit's own RuntimeDirectory, owned
# by the dynamic user, mode 0400. RuntimeDirectory is removed when the service stops.
ExecStartPre=+/usr/bin/install -o kanidmd -g kanidmd -m 0400 /etc/pki/kanidm/chain.pem /run/kanidmd/tls_chain.pem
ExecStartPre=+/usr/bin/install -o kanidmd -g kanidmd -m 0400 /etc/pki/kanidm/key.pem /run/kanidmd/tls_key.pem
