# /etc/systemd/journald.conf.d/50-chp-persistent.conf (chp-identity-server; ISO 0.7.0 Plan 3 Task 13a, P3-D14):
# the server's journal survives a reboot. Rocky's default (Storage=auto without /var/log/journal) keeps it in /run
# only, so the document appender's journal lines (monitor check 82's journal side) and the ISSO daily review's
# journal-based rows were lost at every reboot. Bounded: at most SystemMaxUse on disk, oldest first.
[Journal]
Storage=persistent
SystemMaxUse=1G
