# /etc/httpd/conf.d/chp-nextcloud.conf (chp-documents): NextCloud over HTTPS on 8443 ONLY. Kanidm owns SERVER_IP:443,
# so the stock listeners (httpd.conf "Listen 80", mod_ssl's ssl.conf "Listen 443") are switched off by
# /usr/libexec/chp/nextcloud-httpd-stock-off, run before every httpd start (see chp-egress.conf drop-in).
# SITE-INDEPENDENT: the LAN restriction lives in /etc/httpd/conf.d/chp-nextcloud-lan.inc, rendered by
# `chp-site documents enable` ("Require ip <SUBNET_CIDR>"); until it is rendered the shipped file says
# "Require all denied", so nothing is served. The certificate is /etc/pki/nextcloud/{chain,key}.pem.
Listen 8443 https
<VirtualHost *:8443>
    DocumentRoot /usr/lib/nextcloud
    SSLEngine on
    SSLCertificateFile /etc/pki/nextcloud/chain.pem
    SSLCertificateKeyFile /etc/pki/nextcloud/key.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set Strict-Transport-Security "max-age=15552000"
    # The LAN restriction is a <Location> (merged AFTER .htaccess), so no .htaccess can replace it.
    <Location "/">
        Include /etc/httpd/conf.d/chp-nextcloud-lan.inc
    </Location>
    # chp_ledger's request route (ISO 0.7.0 Plan 3): a publish carries content + pdf_content as base64, together at
    # most 64 MiB decoded (the app's MAX_CONTENT) = at most 85.33 MiB of base64 (MAX_B64) plus a few kB of JSON. 96 MiB
    # leaves ~10 MiB of headroom and stops a runaway body before PHP reads it (httpd's default is 1 GiB). v1 and v2:
    # both OCS entry points route the app. Only the limit here: the LAN rule above still applies.
    <LocationMatch "^/ocs/v[12]\.php/apps/chp_ledger/">
        LimitRequestBody 100663296
    </LocationMatch>
    <Directory /usr/lib/nextcloud>
        AllowOverride All
        Options FollowSymLinks MultiViews
        <IfModule mod_dav.c>
            Dav off
        </IfModule>
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/nextcloud.sock|fcgi://localhost"
    </FilesMatch>
    RewriteEngine On
    # /login straight to Kanidm with two user_oidc providers (ISO 0.7.0 Plan 3)
    Include /etc/httpd/conf.d/chp-nextcloud-login-rewrite.inc
    RewriteRule ^/\.well-known/carddav /remote.php/dav [R=301,L]
    RewriteRule ^/\.well-known/caldav /remote.php/dav [R=301,L]
    ErrorLog /var/log/httpd/nextcloud-error.log
    CustomLog /var/log/httpd/nextcloud-access.log combined
</VirtualHost>
