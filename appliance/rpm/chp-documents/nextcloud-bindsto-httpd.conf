# /etc/systemd/system/httpd.service.d/chp-egress.conf (chp-documents): NextCloud never runs without its egress table
[Unit]
BindsTo=chp-nextcloud-egress.service
After=chp-nextcloud-egress.service
[Service]
ExecStartPre=/usr/sbin/nft list table inet chp_nextcloud_egress
# httpd listens on 8443 only (Kanidm owns :443): switch the stock listeners off before every start
ExecStartPre=/usr/libexec/chp/nextcloud-httpd-stock-off
