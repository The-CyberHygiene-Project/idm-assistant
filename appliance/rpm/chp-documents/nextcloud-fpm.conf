; NextCloud php-fpm pool (chp-documents)
[nextcloud]
user = apache
group = apache
listen = /run/php-fpm/nextcloud.sock
listen.acl_users = apache
listen.allowed_clients = 127.0.0.1
pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
env[PATH] = /usr/bin:/bin
env[TMP] = /var/tmp
php_admin_value[error_log] = /var/log/php-fpm/nextcloud-error.log
php_admin_flag[log_errors] = on
php_value[memory_limit] = 512M
php_value[upload_max_filesize] = 2G
php_value[post_max_size] = 2G
php_value[max_execution_time] = 3600
php_value[output_buffering] = off
php_value[session.save_handler] = files
php_value[session.save_path] = /var/lib/php/session
php_value[opcache.interned_strings_buffer] = 16
php_value[apc.enable_cli] = 1
