# /etc/httpd/conf.d/chp-nextcloud-login-rewrite.inc (chp-documents; ISO 0.7.0 Plan 3), included by chp-nextcloud.conf
# inside the NextCloud <VirtualHost>, after "RewriteEngine On". From lab/docs-spike/proto/nextcloud-login-rewrite.conf
# (spike logs/62). user_oidc sends /login straight to Kanidm only while exactly ONE provider exists (Application.php
# registerRedirect); `chp-site documents enable` adds a second, Bearer-only provider (kanidm-cli, for the doc
# commands), and the login page would then show two buttons. These lines send /login to provider 1 (kanidm: enable
# refuses unless it is id 1), keeping redirect_url (Login Flow v2's grant page needs it; user_oidc strips scheme and
# host from it, so it is no open redirect). /login?direct=1 (the break-glass admin) is left alone. /ocs and
# /remote.php are not touched: user_oidc checks the doc commands' Bearer there.
    RewriteCond %{QUERY_STRING} !(^|&)direct=1(&|$)
    RewriteCond %{QUERY_STRING} (?:^|&)redirect_url=([^&]*)
    RewriteRule ^/(?:index\.php/)?login$ /index.php/apps/user_oidc/login/1?redirectUrl=%1 [R=302,L,NE]
    RewriteCond %{QUERY_STRING} !(^|&)direct=1(&|$)
    RewriteRule ^/(?:index\.php/)?login$ /index.php/apps/user_oidc/login/1 [R=302,L,QSD]
