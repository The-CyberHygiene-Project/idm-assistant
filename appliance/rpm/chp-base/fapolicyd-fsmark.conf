# chp-base: allow_filesystem_mark for fapolicyd (ISO 0.7.0 Plan 2, SPIKE-NEXTCLOUD finding 1).
# FSMARK=0 (shipped): OFF. fapolicyd stays as installed (allow_filesystem_mark = 0, so processes in their own mount
#                     namespace are not checked).
# FSMARK=1:           ON. Run `/usr/libexec/chp/fapolicyd-fsmark` (or reinstall chp-base) to apply it; fill the trust
#                     rules the trial found in /etc/fapolicyd/rules.d/66-chp-fsmark.rules, then fagenrules --load and
#                     systemctl restart fapolicyd. Do NOT turn it on without those rules: it blocks php-fpm, suricata, ...
FSMARK=0
