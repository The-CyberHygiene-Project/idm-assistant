# ks.cfg for chp-build (owner decision 4): Rocky 9.8 minimal RPM build VM. Not a lab host, no IdM, no internet route.
# @PUBKEY@ is replaced by create.sh with the build-VM ssh public key (the private key stays on the Mac, never in git).
text
reboot
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=static --ip=192.168.100.60 --netmask=255.255.255.0 --device=link --onboot=yes --hostname=chp-build
rootpw --lock
user --name=builder --groups=wheel --lock
sshkey --username=builder "@PUBKEY@"
selinux --enforcing
firewall --enabled --ssh
zerombr
clearpart --all --initlabel
autopart --type=plain --nohome
bootloader --append="console=ttyS0,115200"
%packages
@^minimal-environment
rpm-build
rpmdevtools
tar
bzip2
gzip
-fapolicyd
%end
%post
echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder; chmod 0440 /etc/sudoers.d/builder
%end
