# NextCloud (SPIKE): HTTPS only, on its own port (Kanidm owns SERVER_IP:443), LAN-only by firewalld.
Listen 8443 https
<VirtualHost *:8443>
    ServerName files.docs.lab.test
    DocumentRoot /usr/lib/nextcloud
    SSLEngine on
    SSLCertificateFile /etc/pki/nextcloud/chain.pem
    SSLCertificateKeyFile /etc/pki/nextcloud/key.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set Strict-Transport-Security "max-age=15552000"
    <Directory /usr/lib/nextcloud>
        Require all granted
        AllowOverride All
        Options FollowSymLinks MultiViews
        <IfModule mod_dav.c>
            Dav off
        </IfModule>
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/nextcloud.sock|fcgi://localhost"
    </FilesMatch>
    RewriteEngine On
    RewriteRule ^/\.well-known/carddav /remote.php/dav [R=301,L]
    RewriteRule ^/\.well-known/caldav /remote.php/dav [R=301,L]
    ErrorLog /var/log/httpd/nextcloud-error.log
    CustomLog /var/log/httpd/nextcloud-access.log combined
</VirtualHost>
