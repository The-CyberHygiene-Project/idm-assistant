    # SPIKE (Task 2): with a second user_oidc provider (kanidm-cli, Bearer only) user_oidc no longer sends /login
    # straight to Kanidm (it does so only when exactly ONE provider exists, Application.php registerRedirect), and the
    # login page shows two buttons. These lines, inside the NextCloud <VirtualHost> after "RewriteEngine On", restore
    # the direct redirect to provider 1, keeping redirect_url (Login Flow v2's grant page needs it); /login?direct=1
    # (the break-glass admin) is left alone.
    RewriteCond %{QUERY_STRING} !(^|&)direct=1(&|$)
    RewriteCond %{QUERY_STRING} (?:^|&)redirect_url=([^&]*)
    RewriteRule ^/(?:index\.php/)?login$ /index.php/apps/user_oidc/login/1?redirectUrl=%1 [R=302,L,NE]
    RewriteCond %{QUERY_STRING} !(^|&)direct=1(&|$)
    RewriteRule ^/(?:index\.php/)?login$ /index.php/apps/user_oidc/login/1 [R=302,L,QSD]
